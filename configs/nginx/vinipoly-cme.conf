# ============================================================================
# ViniPoly DRM — Nginx FastCGI Configuration for .php and .cme Execution
# Hướng dẫn: Thay thế hoặc bổ sung vào cấu hình enable-php-XX.conf trên Nginx
# ============================================================================

# 1. Clean URL Redirect: Chuyển hướng /page.cme -> /page (Tùy chọn SEO)
if ($request_uri ~* "^/([^?]+)\.cme(?:\?(.*))?$") {
    return 301 /$1?$2;
}

# 2. Extensionless Routing: Tự động ánh xạ /page sang /page.cme nếu tồn tại
location / {
    try_files $uri $uri/ $uri.cme $uri.php?$args;
}

# 3. FastCGI Handler cho cả .php và .cme (Zero-Disk RAM Execution)
location ~ [^/]\.(php|cme)(/|$) {
    try_files $uri =404;
    fastcgi_pass  unix:/tmp/php-cgi-82.sock; # Đổi theo phiên bản PHP (73, 74, 80, 81, 82, 83)
    fastcgi_index index.cme;
    include fastcgi.conf;
    include pathinfo.conf;
}
