# ============================================================================
# ViniPoly DRM v3.0 — Nginx FastCGI Configuration for .php and .cme Execution
# Supports PHP 7.3 -> 8.5 (Zero-Disk Native RAM Execution)
# ============================================================================

index index.cme index.php index.html;

# 1. Optional SEO Clean URL Redirect (/page.cme -> /page for GET/HEAD)
if ($request_method ~ ^(GET|HEAD)$) {
    rewrite ^/index\.cme$ / permanent;
    rewrite ^/(.+)/index\.cme$ /$1/ permanent;
}

# 2. Extensionless & .php -> .cme Fallback Routing
location / {
    try_files $uri $uri/ $uri.cme $uri.php?$args;
}

# 3. FastCGI Handler for both .php and .cme
location ~ [^/]\.(php|cme)(/|$) {
    try_files $uri =404;
    fastcgi_pass  unix:/tmp/php-cgi-83.sock; # Adjust to your PHP-FPM socket (73..85)
    fastcgi_index index.cme;
    include fastcgi.conf;
}
