# ============================================================================
# ViniPoly DRM v3.0 — OpenLiteSpeed / LiteSpeed Enterprise Snippet
# Note: running 'vinipoly' CLI configures OpenLiteSpeed automatically!
# ============================================================================

# 1. /usr/local/lsws/conf/mime.properties:
#    cme = application/x-httpd-php

# 2. Vhost index configuration:
index  {
  useServer               0
  indexFiles              index.cme,index.php,index.html
}

# 3. Vhost scriptHandler configuration (example for lsphp83):
scriptHandler  {
  add                     lsapi:lsphp83 php
  add                     lsapi:lsphp83 cme
}
